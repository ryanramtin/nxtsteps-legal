<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NxtSteps AI – Legal</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #fff;
      color: #1a1a2e;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .container {
      max-width: 560px;
      width: 100%;
      padding: 48px 24px;
      text-align: center;
    }
    .logo-wrap { margin-bottom: 32px; }
    .logo-icon {
      width: 72px; height: 72px;
      background: linear-gradient(135deg, #6C47FF 0%, #3B82F6 100%);
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin-bottom: 16px;
    }
    h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; color: #030917; }
    .subtitle { margin-top: 8px; font-size: 15px; color: #6b7280; }
    .cards {
      margin-top: 40px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .card {
      display: block;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 24px 28px;
      text-decoration: none;
      color: inherit;
      transition: box-shadow 0.15s, border-color 0.15s;
      text-align: left;
    }
    .card:hover { border-color: #6C47FF; box-shadow: 0 4px 20px rgba(108,71,255,0.12); }
    .card-title { font-size: 17px; font-weight: 600; color: #030917; }
    .card-desc { font-size: 14px; color: #6b7280; margin-top: 4px; }
    .footer {
      margin-top: 48px;
      font-size: 13px;
      color: #9ca3af;
    }
    .footer a { color: #6C47FF; text-decoration: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-wrap">
      <div class="logo-icon">🧭</div>
      <h1>NxtSteps AI</h1>
      <p class="subtitle">AI-powered meeting intelligence for iOS</p>
    </div>
    <div class="cards">
      <a href="privacy.html" class="card">
        <div class="card-title">🔒 Privacy Policy</div>
        <div class="card-desc">How we collect, use, and protect your data</div>
      </a>
      <a href="terms.html" class="card">
        <div class="card-title">📄 Terms of Service</div>
        <div class="card-desc">Rules for using NxtSteps AI</div>
      </a>
    </div>
    <div class="footer">
      <p>Questions? <a href="mailto:ryanramtin@gmail.com">ryanramtin@gmail.com</a></p>
      <p style="margin-top:8px;">Bundle ID: ai.nxtsteps.mobile</p>
    </div>
  </div>
</body>
</html>
